<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>乖乖我爱你</title>
<style>
:root { --bg: #000000; }

* { margin:0;padding:0;box-sizing:border-box; }

body {
  width:100vw;height:100dvh;overflow:hidden;

#gate {

<canvas id="heartCanvas"></canvas>
<canvas id="sparkleCanvas"></canvas>
<canvas id="fwCanvas"></canvas>

<!-- 恋爱纪念日 -->
<div class="side-panel right">

  <source src="a-thousand-years.mp3" type="audio/mpeg">

<script>
// ═══════════════════════════════════════════
//  纪念日计算
// ═══════════════════════════════════════════

const ANNIVERSARY = new Date(2026, 4, 10); // 2026-05-10

function updateAnniversary() {
  const now = new Date();
  const diffDays = Math.floor((now.getTime() - ANNIVERSARY.getTime()) / 86400000) + 1;
  document.getElementById('anniversaryDays').textContent = Math.max(0, diffDays);
  document.getElementById('anniversaryDate').textContent = '2026.05.10 起';
}
updateAnniversary();

function scheduleMidnightRefresh() {
  const now = new Date();
  const ms = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1).getTime() - now.getTime();
  setTimeout(() => { updateAnniversary(); setInterval(updateAnniversary, 86400000); }, ms + 1000);
}
scheduleMidnightRefresh();

// ═══════════════════════════════════════════
//  爱心粒子动画
// ═══════════════════════════════════════════

const heartCanvas = document.getElementById('heartCanvas');
const hCtx = heartCanvas.getContext('2d');

let CW, CH, CX, CY, IMAGE_ENLARGE;
function resizeHeartCanvas() {
  heartCanvas.width = CW = window.innerWidth;
  heartCanvas.height = CH = window.innerHeight;
  CX = CW / 2; CY = CH / 2;
  IMAGE_ENLARGE = Math.min(CW, CH) * 0.026;
}
resizeHeartCanvas();

const TAU = Math.PI * 2;

function heartXY(t, sr) {
  const x = 17 * Math.pow(Math.sin(t), 3);
  const y = -(16*Math.cos(t) - 5*Math.cos(2*t) - 2*Math.cos(3*t) - Math.cos(4*t));
  return [x * sr + CX, y * sr + CY];
}

function scatterXY(x, y, beta) {
  const rx = -beta * Math.log(Math.random());
  const ry = -beta * Math.log(Math.random());
  return [x - rx*(x-CX), y - ry*(y-CY)];
}

function curve(p) { return (4*Math.sin(4*p))/TAU; }

let frames = [];
const frameCount = 60;
const N_HEART = 500, N_CENTER = 2500, N_HALO_BASE = 700;

function buildHeartData() {
  frames = [];
  const hpts = [], edgePts = [], centerPts = [];

  for (let i = 0; i < N_HEART; i++) hpts.push(heartXY(Math.random()*TAU, IMAGE_ENLARGE));
  for (const [px,py] of hpts) for (let k=0;k<3;k++) edgePts.push(scatterXY(px,py,0.05));
  for (let i=0;i<N_CENTER;i++) {
    const [hx,hy] = hpts[Math.floor(Math.random()*N_HEART)];
    centerPts.push(scatterXY(hx,hy,0.27));
  }

  function forceCalc(px, py, ratio, jitter) {
    const d = 1 / Math.pow((px-CX)*(px-CX)+(py-CY)*(py-CY), 0.42);
    const jh = jitter >> 1;
    return [px - ratio*d*(px-CX) - (Math.floor(Math.random()*jitter)-jh),
            py - ratio*d*(py-CY) - (Math.floor(Math.random()*jitter)-jh)];
  }

  for (let f = 0; f < frameCount; f++) {
    const t = f / frameCount;
    const ratio = 15 * curve(t * TAU);
    const haloR = Math.floor(4 + 6*(1+curve(t*TAU)));
    const haloN = Math.floor(N_HALO_BASE + 1000*Math.abs(curve(t*TAU)**2));
    const arr = [];

    const haloSet = {};
    for (let i = 0; i < haloN; i++) {
      let [hx,hy] = heartXY(Math.random()*TAU, -15);
      const ds = (hx-CX)*(hx-CX)+(hy-CY)*(hy-CY);
      const fr = -1/Math.pow(ds, 0.6);
      hx -= fr*haloR*(hx-CX); hy -= fr*haloR*(hy-CY);
      const k = Math.round(hx)+','+Math.round(hy);
      if (!haloSet[k]) { haloSet[k]=1;
        hx += Math.floor(Math.random()*121)-60;
        hy += Math.floor(Math.random()*121)-60;
        arr.push(hx, hy, Math.random()<0.5?1:2);
      }
    }
	    for (const [px,py] of hpts) { const [x,y]=forceCalc(px,py,ratio,3); arr.push(x,y,Math.floor(Math.random()*2)+1); }
	    for (const [px,py] of edgePts) { const [x,y]=forceCalc(px,py,ratio,3); arr.push(x,y,Math.floor(Math.random()*2)+1); }
	    for (const [px,py] of centerPts) { const [x,y]=forceCalc(px,py,ratio,3); arr.push(x,y,Math.floor(Math.random()*2)+1); }

    frames.push(arr);
  }
}
buildHeartData();

const HEART_R = 0xff, HEART_G = 0x30, HEART_B = 0x60;
let imgData, lastFrameTime = 0;
const FRAME_MS = 44;

function renderHeartFrame(fi) {
  if (!frames.length) return requestAnimationFrame(()=>renderHeartFrame(fi));

  const now = performance.now();
  if (now - lastFrameTime < FRAME_MS) {
    requestAnimationFrame(()=>renderHeartFrame(fi));
    return;
  }
  lastFrameTime = now;

  hCtx.clearRect(0,0,CW,CH);
  hCtx.save();
  hCtx.globalAlpha = 0.12;
  const GR = Math.min(CW,CH)*0.28;
  const gg = hCtx.createRadialGradient(CX,CY,GR*0.3,CX,CY,GR);
  gg.addColorStop(0, '#ff4470');
  gg.addColorStop(0.5, 'rgba(255,68,112,0.18)');
  gg.addColorStop(1, 'transparent');
  hCtx.fillStyle = gg;
  hCtx.fillRect(0,0,CW,CH);
  hCtx.restore();

  const pts = frames[fi % frameCount];
  if (!pts) { requestAnimationFrame(()=>renderHeartFrame(fi)); return; }

  imgData = imgData || hCtx.createImageData(CW, CH);
  const buf = imgData.data;
  const len4 = CW*CH*4;
  for (let i=3;i<len4;i+=4) { buf[i]=0; buf[i-1]=0; buf[i-2]=0; }

  for (let i=0;i<pts.length;i+=3) {
    const x=pts[i]|0, y=pts[i+1]|0, s=pts[i+2]|0;
    for (let dy=0;dy<s;dy++) {
      const row=y+dy; if (row<0||row>=CH) continue;
      const off=row*CW*4;
      for (let dx=0;dx<s;dx++) {
        const col=x+dx; if (col<0||col>=CW) continue;
        const idx=off+col*4;
        buf[idx]=HEART_R; buf[idx+1]=HEART_G; buf[idx+2]=HEART_B; buf[idx+3]=255;
      }
    }
  }
  hCtx.putImageData(imgData,0,0);

  requestAnimationFrame(()=>renderHeartFrame(fi+1));
}

// ═══════════════════════════════════════════
//  优雅粒子特效
// ═══════════════════════════════════════════

const sparkleCanvas = document.getElementById('sparkleCanvas');
const spCtx = sparkleCanvas.getContext('2d');
sparkleCanvas.width = window.innerWidth;
sparkleCanvas.height = window.innerHeight;

let sparkles = [];

class Sparkle {
  constructor(x, y, color) {
    this.x = x; this.y = y; this.vx = (Math.random()-0.5)*2;
    this.vy = -(Math.random()*3+1.5);
    this.color = color || ['#ff6b9d','#ffb3c6','#ffd740','#ff8c00','#c084fc','#22d3ee'][Math.floor(Math.random()*6)];
    this.life = 1; this.decay = Math.random()*0.012+0.006;
    this.size = Math.random()*3+1.5;
    this.glow = Math.random()*0.6+0.4;
  }
  update() {
    this.x += this.vx; this.y += this.vy; this.vy += 0.02;
    this.life -= this.decay;
    return this.life > 0;
  }
  draw(ctx) {
    const a = Math.max(0, this.life);
    ctx.save();
    ctx.globalAlpha = a * this.glow;
    ctx.fillStyle = this.color;
    ctx.shadowBlur = 8 * a;
    ctx.shadowColor = this.color;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size * a, 0, TAU);
    ctx.fill();
    ctx.restore();
  }
}

function emitSparkles(x, y, count, colors) {
  for (let i=0;i<count;i++) {
    const sp = new Sparkle(x+(Math.random()-0.5)*30, y+(Math.random()-0.5)*30);
    if (colors) sp.color = colors[Math.floor(Math.random()*colors.length)];
    sparkles.push(sp);
  }
}

function animSparkles() {
  spCtx.clearRect(0,0,sparkleCanvas.width,sparkleCanvas.height);
  sparkles = sparkles.filter(s => { const alive=s.update(); if(alive)s.draw(spCtx); return alive; });
  requestAnimationFrame(animSparkles);
}
animSparkles();

// ═══════════════════════════════════════════
//  烟花系统
// ═══════════════════════════════════════════

const fwCanvas = document.getElementById('fwCanvas');
const fwCtx = fwCanvas.getContext('2d');
let fireworks = [];

function resizeFw() { fwCanvas.width = window.innerWidth; fwCanvas.height = window.innerHeight; }
resizeFw();

class Rocket {
  constructor(x, targetY) {
    this.x=x;this.y=window.innerHeight;this.targetY=targetY;
    this.speed=7+Math.random()*5;this.trail=[];
    this.color=['#ff3060','#ffd740','#ff8c00','#c084fc','#22d3ee','#f472b6'][Math.floor(Math.random()*6)];
  }
  update(){
    this.trail.push({x:this.x,y:this.y,life:1});
    if(this.trail.length>18) this.trail.shift();
    this.y-=this.speed;this.trail.forEach(t=>t.life-=0.055);
    return this.y<=this.targetY;
  }
  draw(ctx){
    this.trail.forEach(t=>{
      ctx.save();ctx.globalAlpha=t.life*0.5;ctx.fillStyle=this.color;ctx.shadowBlur=6;ctx.shadowColor=this.color;
      ctx.beginPath();ctx.arc(t.x,t.y,2,0,TAU);ctx.fill();ctx.restore();
    });
    ctx.save();ctx.fillStyle='#fff';ctx.shadowBlur=14;ctx.shadowColor=this.color;
    ctx.beginPath();ctx.arc(this.x,this.y,3.5,0,TAU);ctx.fill();ctx.restore();
  }
}

class Spark {
  constructor(x,y,color){
    this.x=x;this.y=y;const a=Math.random()*TAU;const s=Math.random()*7+2;
    this.vx=Math.cos(a)*s;this.vy=Math.sin(a)*s;
    this.color=color;this.life=1;this.decay=Math.random()*0.016+0.005;
    this.size=Math.random()*2.2+0.6;this.g=0.025;this.fr=0.987;
  }
  update(){this.x+=this.vx;this.y+=this.vy;this.vy+=this.g;this.vx*=this.fr;this.vy*=this.fr;this.life-=this.decay;}
  draw(ctx){
    ctx.save();ctx.globalAlpha=Math.max(0,this.life);ctx.fillStyle=this.color;ctx.shadowBlur=5;ctx.shadowColor=this.color;
    ctx.beginPath();ctx.arc(this.x,this.y,this.size*this.life,0,TAU);ctx.fill();ctx.restore();
  }
}

class Burst {
  constructor(x,y){
    this.sparks=[];const c=['#ff3060','#ff6b9d','#ffd740','#ff8c00','#c084fc','#22d3ee','#f472b6','#fbbf24'];
    const p=[c[Math.floor(Math.random()*c.length)],c[Math.floor(Math.random()*c.length)],c[Math.floor(Math.random()*c.length)]];
    for(let i=0;i<130;i++) this.sparks.push(new Spark(x,y,p[Math.floor(Math.random()*3)]));
  }
  update(){this.sparks.forEach(s=>s.update());this.sparks=this.sparks.filter(s=>s.life>0);}
  draw(ctx){this.sparks.forEach(s=>s.draw(ctx));}
  get done(){return this.sparks.length===0;}
}

function launchFireworks(n){
  for(let i=0;i<n;i++) setTimeout(()=>{
    const x=window.innerWidth*0.1+Math.random()*window.innerWidth*0.8;
    const ty=window.innerHeight*0.06+Math.random()*window.innerHeight*0.4;
    fireworks.push({type:'r',obj:new Rocket(x,ty)});
  },i*140);
}

function animFw(){
  fwCtx.clearRect(0,0,fwCanvas.width,fwCanvas.height);
  const nf=[];
  for(const f of fireworks){
    if(f.type==='r'){
      if(f.obj.update()) nf.push({type:'b',obj:new Burst(f.obj.x,f.obj.y)});
      else {f.obj.draw(fwCtx);nf.push(f);}
    } else {f.obj.update();f.obj.draw(fwCtx);if(!f.obj.done) nf.push(f);}
  }
  fireworks=nf;requestAnimationFrame(animFw);
}
animFw();

// ═══════════════════════════════════════════
//  Toast
// ═══════════════════════════════════════════

const toastEl=document.getElementById('toast');
let toastTimer;
function showToast(m){
  clearTimeout(toastTimer);
  toastEl.classList.remove('toast--hidden');toastEl.textContent=m;
  toastTimer=setTimeout(()=>toastEl.classList.add('toast--hidden'),3000);
}

function showRandomMessage(){
  const m=['在这个世界上，最幸运的事就是遇见你','乖乖，你的笑容是我每天的阳光','无论多远，我的心都和你在一起','你是我生命中最美好的意外','每一天都想对你说：我爱你','你是我的心跳，是我的唯一','想和你一起慢慢变老','乖乖是这个世界上最可爱的人','遇见你，是我这辈子最大的幸运','春风十里不如你','你就是我的全世界','和你在一起的每一秒都很甜','愿做你的守护星，永远闪亮','陪你看遍世间所有美好','爱你就像爱生命'];
  showToast(m[Math.floor(Math.random()*m.length)]);
}

// ═══════════════════════════════════════════
//  音乐
// ═══════════════════════════════════════════

const bgm = document.getElementById('bgm');
let musicPlaying = false;

function toggleMusic() {
  if (musicPlaying) {
    bgm.pause();
    musicPlaying = false;
    document.getElementById('btnMusic').textContent = 'A Thousand Years';
    showToast('音乐已暂停');
  } else {
    bgm.play().then(() => {
      musicPlaying = true;
      document.getElementById('btnMusic').textContent = '🎵 暂停';
      showToast('A Thousand Years ♪');
    }).catch(() => { showToast('音乐加载失败'); });
  }
}

// ═══════════════════════════════════════════
//  100天纪念日检测 (2026-08-17)
// ═══════════════════════════════════════════
var isSpecialDay = (function () {
  var qs = new URLSearchParams(window.location.search);
  if (qs.get('special') === '1') return true; // 预览开关
  var now = new Date();
  return now.getFullYear() === 2026 && now.getMonth() === 7 && now.getDate() === 17;
})();

// ═══════════════════════════════════════════
//  烟花特效（纪念日专用）
// ═══════════════════════════════════════════
var specialCanvas = document.getElementById('specialCanvas');
var sctx = specialCanvas.getContext('2d');

function runSpecialFirework(callback) {
  specialCanvas.style.display = 'block';
  document.getElementById('heartCanvas').style.display = 'none';
  document.getElementById('sparkleCanvas').style.display = 'none';
  document.getElementById('fwCanvas').style.display = 'none';

  var SW, SH, SDPR;
  var sframe = 0;
  var sphase = 'launch';
  var srocket = { x: 0, y: 0, targetY: 0, speed: 6, trail: [] };
  var sparticles = [];
  var sstars = [];
  var scolors = ["#ff4470", "#ff6b9d", "#ffb3c6", "#ffd740", "#ffffff", "#fb7185"];
  var smessage = isSpecialDay ? "祝我们100天快乐" : "祝我们100天快乐";

  function sResize() {
    SDPR = window.devicePixelRatio || 1;
    SW = window.innerWidth; SH = window.innerHeight;
    specialCanvas.width = SW * SDPR;
    specialCanvas.height = SH * SDPR;
    specialCanvas.style.width = SW + 'px';
    specialCanvas.style.height = SH + 'px';
    sctx.setTransform(SDPR, 0, 0, SDPR, 0, 0);
  }
  sResize();
  srocket.x = SW / 2;
  srocket.y = SH + 40;
  srocket.targetY = SH * 0.32;

  for (var i = 0; i < 120; i++) {
    sstars.push({ x: Math.random() * SW, y: Math.random() * SH, r: Math.random() * 1.6 + 0.3, alpha: Math.random() * 0.6 + 0.25 });
  }

  function smakeTextPoints() {
    var off = document.createElement('canvas');
    var octx = off.getContext('2d');
    off.width = SW; off.height = SH;
    var fontSize = Math.min(SW / 10, 82);
    octx.fillStyle = '#fff'; octx.textAlign = 'center'; octx.textBaseline = 'middle';
    octx.font = '700 ' + fontSize + 'px "Microsoft YaHei", "PingFang SC", sans-serif';
    var textY = SH * 0.46;
    octx.fillText(smessage, SW / 2, textY);
    var data = octx.getImageData(0, 0, SW, SH).data;
    var pts = [];
    var gap = SW < 520 ? 7 : 6;
    for (var y = 0; y < SH; y += gap) {
      for (var x = 0; x < SW; x += gap) {
        if (data[(y * SW + x) * 4 + 3] > 128) pts.push({ x: x, y: y });
      }
    }
    return pts;
  }

  function screateExplosion() {
    var textPts = smakeTextPoints();
    sparticles = textPts.map(function (pt, j) {
      var angle = Math.random() * Math.PI * 2;
      var dist = Math.random() * 220 + 40;
      return {
        x: srocket.x + Math.cos(angle) * dist, y: srocket.targetY + Math.sin(angle) * dist,
        tx: pt.x, ty: pt.y,
        vx: Math.cos(angle) * (Math.random() * 7 + 2), vy: Math.sin(angle) * (Math.random() * 7 + 2),
        size: Math.random() * 2.2 + 1.2, color: scolors[j % scolors.length],
        delay: Math.random() * 40
      };
    });
    sphase = 'forming';
    sframe = 0;
  }

  function sdrawStars() {
    for (var j = 0; j < sstars.length; j++) {
      var s = sstars[j];
      sctx.globalAlpha = s.alpha + Math.sin(sframe * 0.03 + s.x) * 0.18;
      sctx.fillStyle = '#ffffff';
      sctx.beginPath(); sctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); sctx.fill();
    }
    sctx.globalAlpha = 1;
  }

  function sdrawRocket() {
    srocket.trail.push({ x: srocket.x, y: srocket.y });
    if (srocket.trail.length > 28) srocket.trail.shift();
    for (var j = 0; j < srocket.trail.length; j++) {
      var p = srocket.trail[j];
      sctx.globalAlpha = j / srocket.trail.length;
      sctx.fillStyle = '#ffd166';
      sctx.beginPath(); sctx.arc(p.x, p.y, 3 + j * 0.08, 0, Math.PI * 2); sctx.fill();
    }
    sctx.globalAlpha = 1;
    sctx.fillStyle = '#ffffff';
    sctx.beginPath(); sctx.arc(srocket.x, srocket.y, 4, 0, Math.PI * 2); sctx.fill();
    sctx.shadowColor = '#ff4470'; sctx.shadowBlur = 18;
    sctx.fillStyle = '#ff4470';
    sctx.beginPath(); sctx.arc(srocket.x, srocket.y + 9, 3, 0, Math.PI * 2); sctx.fill();
    sctx.shadowBlur = 0;
  }

  function supdateRocket() {
    srocket.x = SW / 2 + Math.sin(sframe * 0.08) * 18;
    srocket.y -= srocket.speed;
    srocket.speed *= 0.992;
    if (srocket.y <= srocket.targetY) screateExplosion();
  }

  function sdrawFlash() {
    var alpha = Math.max(0, 1 - sframe / 45);
    if (alpha <= 0) return;
    var radius = sframe * 7;
    var g = sctx.createRadialGradient(srocket.x, srocket.targetY, 0, srocket.x, srocket.targetY, radius);
    g.addColorStop(0, 'rgba(255,255,255,' + alpha + ')');
    g.addColorStop(0.35, 'rgba(255,209,102,' + (alpha * 0.55) + ')');
    g.addColorStop(1, 'rgba(255,68,112,0)');
    sctx.fillStyle = g;
    sctx.beginPath(); sctx.arc(srocket.x, srocket.targetY, radius, 0, Math.PI * 2); sctx.fill();
  }

  function sdrawParticles() {
    for (var j = 0; j < sparticles.length; j++) {
      var p = sparticles[j];
      if (sframe < p.delay) continue;
      var ease = Math.min(1, (sframe - p.delay) / 120);
      var pull = ease * ease * (3 - 2 * ease);
      p.x += (p.tx - p.x) * (0.018 + pull * 0.055);
      p.y += (p.ty - p.y) * (0.018 + pull * 0.055);
      if (ease < 0.5) { p.x += p.vx * (1 - ease * 2); p.y += p.vy * (1 - ease * 2); }
      var twinkle = 0.72 + Math.sin(sframe * 0.12 + p.tx * 0.05) * 0.28;
      sctx.globalAlpha = twinkle; sctx.shadowColor = p.color; sctx.shadowBlur = 10;
      sctx.fillStyle = p.color;
      sctx.beginPath(); sctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); sctx.fill();
      sctx.shadowBlur = 0;
    }
    sctx.globalAlpha = 1;
  }

  function sdrawSparkles() {
    if (sphase === 'launch') return;
    for (var j = 0; j < 24; j++) {
      var angle = (j / 24) * Math.PI * 2 + sframe * 0.01;
      var r = 110 + Math.sin(sframe * 0.04 + j) * 18;
      var sx = SW / 2 + Math.cos(angle) * r;
      var sy = SH * 0.46 + Math.sin(angle) * r * 0.45;
      sctx.globalAlpha = 0.35; sctx.fillStyle = scolors[j % scolors.length];
      sctx.beginPath(); sctx.arc(sx, sy, 1.4, 0, Math.PI * 2); sctx.fill();
    }
    sctx.globalAlpha = 1;
  }

  var doneCalled = false;
  var doneTimer = null;

  function sanimate() {
    sframe++;
    sctx.fillStyle = 'rgba(2,3,10,0.18)';
    sctx.fillRect(0, 0, SW, SH);
    sdrawStars();
    if (sphase === 'launch') { supdateRocket(); sdrawRocket(); }
    else if (sphase === 'forming') {
      sdrawFlash(); sdrawParticles(); sdrawSparkles();
      // 粒子成形后 3 秒淡出
      if (!doneCalled && sframe > 300) {
        doneCalled = true;
        doneTimer = setTimeout(function () {
          var fade = setInterval(function () {
            var op = parseFloat(specialCanvas.style.opacity || 1);
            op -= 0.06;
            if (op <= 0) {
              clearInterval(fade);
              specialCanvas.style.display = 'none';
              specialCanvas.style.opacity = 1;
              callback();
            } else {
              specialCanvas.style.opacity = op;
            }
          }, 30);
        }, 3000);
      }
    }
    requestAnimationFrame(sanimate);
  }
  sanimate();
}
